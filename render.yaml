# Render Blueprint for the Mann Ki Mannat API.
# Create the service from Render Dashboard > New > Blueprint and select this repository.
#
# Render does not provide managed MySQL, so DATABASE_URL must point to your
# Hostinger MySQL database. Enable Hostinger > Databases > Remote MySQL first
# (Any Host / %) because Render's free service has no fixed outbound IP.
services:
  - type: web
    name: mann-ki-mannat-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run db:generate && npm run db:deploy
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.1
      - key: LOG_LEVEL
        value: info
      # Generated once by Render. Never hardcode these in the repository.
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_SETUP_TOKEN
        generateValue: true
      # Exact Netlify site origin, for example https://maankit.netlify.app
      # (no trailing slash). Update this after Netlify gives you the site URL.
      - key: FRONTEND_URL
        sync: false
      # Hostinger MySQL connection string, for example:
      # mysql://DB_USER:DB_PASSWORD@srv1517.hstgr.io:3306/DB_NAME
      # Add ?sslaccept=strict only if your Hostinger plan requires SSL.
      - key: DATABASE_URL
        sync: false
      # Store WhatsApp number used for prefilled order enquiries.
      - key: WHATSAPP_BUSINESS_NUMBER
        value: '918680871115'
      # Optional: add these in the Render dashboard only if you use Cloudinary
      # product-image uploads.
      # - key: CLOUDINARY_CLOUD_NAME
      # - key: CLOUDINARY_API_KEY
      # - key: CLOUDINARY_API_SECRET
      # For a custom domain (for example maankit.com + api.maankit.com), add:
      # - key: ADMIN_COOKIE_SAME_SITE
      #   value: lax
